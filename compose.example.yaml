services:
  sshmux-mcp:
    build:
      context: .
    image: sshmux-mcp:local
    container_name: sshmux-mcp
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SSH_MCP_TOKEN_FILE: /config/token   # shared secret; requests without it get 401
    volumes:
      - ./keys/id_ed25519:/keys/id_ed25519:ro
      - ./keys/known_hosts:/keys/known_hosts:ro
      - ./config:/config                  # container.toml, token, learned host keys
    ports:
      - 127.0.0.1:8011:8011   # loopback only; put a TLS proxy or tunnel in front for remote clients
