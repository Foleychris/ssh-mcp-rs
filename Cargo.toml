[package]
name = "sshmux-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "MCP server that runs commands and edits files on remote hosts over pooled, multiplexed SSH (stdio or Streamable HTTP)"
repository = "https://github.com/foleychris/ssh-mcp-rs"
readme = "README.md"
keywords = ["mcp", "ssh", "llm", "agent", "claude"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src", "/tests/stdio.rs", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
regex = "1.13.1"
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
